name: Build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: bash scripts/fetch-android-tools.sh
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.DOSEWELL_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DOSEWELL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOSEWELL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DOSEWELL_KEY_PASSWORD }}
        run: |
          # Every build gets a higher version code, as Google Play requires.
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))
          if [ -n "$KEYSTORE_B64" ]; then
            # Your own upload key: builds the APK and the .aab to upload to Play.
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dosewell.jks"
            export DOSEWELL_KEYSTORE_FILE="$RUNNER_TEMP/dosewell.jks" DOSEWELL_KEYSTORE_PASSWORD="$STORE_PASS" DOSEWELL_KEY_ALIAS="$KEY_ALIAS" DOSEWELL_KEY_PASSWORD="$KEY_PASS"
            bash scripts/build-android.sh
          else
            # No upload key yet: a test APK signed with the repository's test key (not for Play).
            SKIP_AAB=1 bash scripts/build-android.sh
          fi
      - uses: actions/upload-artifact@v4
        with: { name: dosewell-android, path: "dist/Dosewell-*", if-no-files-found: error }
      - name: Publish the build on the Releases page
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.DOSEWELL_KEYSTORE_BASE64 != '' }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER-build$GITHUB_RUN_NUMBER"
          if [ "$HAS_KEY" = "true" ]; then
            NOTES="Signed with your upload key. Upload the .aab to Google Play; the .apk is for installing directly."
            gh release create "$TAG" dist/Dosewell-* --title "Dosewell $VER (build $GITHUB_RUN_NUMBER)" --notes "$NOTES"
          else
            NOTES="Test build signed with the repository test key. Install the .apk on a phone to try it. Not for Google Play."
            gh release create "$TAG" dist/Dosewell-* --title "Dosewell $VER test (build $GITHUB_RUN_NUMBER)" --notes "$NOTES" --prerelease
          fi
