name: Build Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: bash scripts/fetch-android-tools.sh
      - name: Restore the release keystore (only when the secrets exist; otherwise a throwaway test key is used)
        env:
          KEYSTORE_B64: ${{ secrets.DOSEWELL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dosewell.jks"; echo "DOSEWELL_KEYSTORE_FILE=$RUNNER_TEMP/dosewell.jks" >> "$GITHUB_ENV"; fi
      - name: Build APK and app bundle
        env:
          DOSEWELL_KEYSTORE_PASSWORD: ${{ secrets.DOSEWELL_KEYSTORE_PASSWORD }}
          DOSEWELL_KEY_ALIAS: ${{ secrets.DOSEWELL_KEY_ALIAS }}
          DOSEWELL_KEY_PASSWORD: ${{ secrets.DOSEWELL_KEY_PASSWORD }}
        run: |
          [ -n "$DOSEWELL_KEYSTORE_PASSWORD" ] || unset DOSEWELL_KEYSTORE_PASSWORD DOSEWELL_KEY_ALIAS DOSEWELL_KEY_PASSWORD
          bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: dosewell-android, path: "dist/Dosewell-*" }
